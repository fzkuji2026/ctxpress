[project]
name = "ctxpress"
version = "1.1.0"
description = "Context management for LLM agents: plug-and-play methods for Codex, Claude Code and other agents, evaluated on official benchmarks"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Fzkuji"}]
keywords = ["llm", "llm-agents", "ai-agents", "context-management", "codex", "claude-code", "compaction", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # the proxy / plug-and-play path uses the standard library only

[project.urls]
Homepage = "https://github.com/fzkuji2026/ctxpress"
Repository = "https://github.com/fzkuji2026/ctxpress"
Documentation = "https://github.com/fzkuji2026/ctxpress/tree/main/docs"

[project.optional-dependencies]
sim = ["pyyaml", "numpy"]   # replay pre-screen and experiment configs
itemmodel = ["scikit-learn", "numpy"]
test = ["pytest"]
analysis = ["matplotlib"]   # figures of `ctxpress analyze`; tables need nothing extra

[project.scripts]
ctxpress = "ctxpress.__main__:main"

[tool.setuptools.packages.find]
include = ["ctxpress*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"ctxpress._vendor.tomllib" = ["LICENSE"]
